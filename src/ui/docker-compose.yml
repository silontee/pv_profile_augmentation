services:
  # ── PostgreSQL 16 + PostGIS 3.4 ──────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: pv_profile_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pv_profile
      POSTGRES_USER: pv_user
      POSTGRES_PASSWORD: pv_password
    ports:
      - "5433:5432"
    volumes:
      - pv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pv_user -d pv_profile"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ETL 초기 데이터 적재 (one-shot) ──────────────────────────
  etl:
    build:
      context: ./backend
    container_name: pv_profile_etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pv_profile
      DB_USER: pv_user
      DB_PASSWORD: pv_password
      DATA_ROOT: /data
    volumes:
      - ../data/processed:/data/processed:ro
      - ../data/openinframap/by_sido:/data/openinframap/by_sido:ro
    command: ["python", "-m", "app.db.load_data"]
    restart: "no"

  # ── FastAPI 백엔드 ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: pv_profile_backend
    restart: unless-stopped
    depends_on:
      etl:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://pv_user:pv_password@db:5432/pv_profile"
      BOUNDARIES_PATH: /data/boundaries/sigungu_2018_simple.geojson
    ports:
      - "8000:8000"
    volumes:
      # 소스 코드 (dev hot-reload)
      - ./backend/app:/app/app
      # 데이터 (read-only)
      - ../data/boundaries:/data/boundaries:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ── React 프론트엔드 (Vite dev server) ───────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: pv_profile_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      # 소스 코드 (dev hot-reload)
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # node_modules는 컨테이너 것 유지
      - /app/node_modules
    env_file:
      - .env
    environment:
      VITE_API_TARGET: http://backend:8000

volumes:
  pv_pgdata:
    driver: local
