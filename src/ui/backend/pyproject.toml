[project]
name = "pv-profile-backend"
version = "0.1.0"
description = "태양광 발전소 프로파일 FastAPI 백엔드"
requires-python = ">=3.12"
dependencies = [
    # FastAPI 웹 프레임워크
    "fastapi>=0.115.0",
    # ASGI 서버
    "uvicorn[standard]>=0.30.0",
    # SQLAlchemy 2.0 비동기 ORM
    "sqlalchemy>=2.0.0",
    # PostGIS 공간 타입 지원
    "geoalchemy2>=0.15.0",
    # 비동기 PostgreSQL 드라이버
    "asyncpg>=0.29.0",
    # 동기 PostgreSQL 드라이버 (ETL용)
    "psycopg2-binary>=2.9.0",
    # Pydantic v2 스키마
    "pydantic>=2.0.0",
    # 환경 변수 관리
    "python-dotenv>=1.0.0",
    # ETL: parquet 읽기
    "polars>=0.20.0",
    # ETL: GeoJSON 처리
    "shapely>=2.0.0",
    # 응답 캐시 (stats 엔드포인트)
    "cachetools>=5.3.0",
    "greenlet>=3.3.2",
    # 외부 WFS 프록시 (토지피복 EGIS)
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
